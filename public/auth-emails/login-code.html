<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>Your Funda login code</title>
  </head>
  <body style="margin:0;padding:0;background-color:#fbfbfa;color:#0b0b0c;font-family:-apple-system,BlinkMacSystemFont,'DM Sans','Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#fbfbfa;padding:40px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="max-width:460px;background-color:#ffffff;border:1px solid #eceae8;border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,0.04);">
            <tr>
              <td style="padding:32px 28px;">
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td style="font-size:22px;font-weight:700;letter-spacing:-0.04em;color:#0b0b0c;line-height:1;">
                      funda<span style="color:#660033;">.</span>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding-top:28px;font-size:22px;font-weight:700;letter-spacing:-0.03em;color:#0b0b0c;line-height:1.25;">
                      Your login code
                    </td>
                  </tr>
                  <tr>
                    <td style="padding-top:20px;">
                      <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background-color:#fcf9fb;border:1px solid #e6d0dc;border-radius:12px;">
                        <tr>
                          <td align="center" style="padding:20px 16px;font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:30px;font-weight:700;letter-spacing:8px;color:#660033;line-height:1.2;">
                            {{ .Token }}
                          </td>
                        </tr>
                      </table>
                    </td>
                  </tr>
                  <tr>
                    <td style="padding-top:28px;border-top:1px solid #f2f0ee;"></td>
                  </tr>
                  <tr>
                    <td style="padding-top:16px;font-size:12px;line-height:1.5;color:#6f6e6b;">
                      Expires shortly. Never share this code with anyone.
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
